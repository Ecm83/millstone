# battery.yaml — vector de rasgos pre-registrado (congelado antes de
# correr corpus nuevos). Reglas: N fijo, razones contra nulo (nunca
# valores brutos), bootstrap por bloques, hash de este archivo en cada
# reporte.

n_tokens: [10000, 30000]
reps: 20

ejes:
  apertura_lexica:
    - hapax         # fracción de tipos con 1 ocurrencia (N fijo)
    - ttr           # tipos/tokens
    - heaps_beta    # exponente de Heaps (log-log, 4 puntos)
    - new1k         # tipos nuevos por 1.000 tokens en último cuartil
  plantilla:
    - timm          # cobertura held-out del bigrama de símbolos
    - families      # % tipos con vecino a edición 1 / nulo barajado
  orden:
    - outdeg        # out-degree top-50 real / barajado intra-línea
    - mi            # información mutua de adyacentes (bits)
  linea:
    - repmass       # masa de tokens repetidos intra-línea / nulo
  eco:
    - echo_z2       # z de colisiones verbatim n=2
    - echo_z3       # z de colisiones verbatim n=3
    - echo_slope    # pendiente del decaimiento log-log (cliff vs cola)
    - echo_nlast    # n máximo con colisiones (geometría del eco)

# model_compare sale del vector: es diagnóstico de mecanismo (DL entre
# modelos rivales), no posición en el panel — vive en hypotheses.

# nulos declarados: shuffled intra-línea para outdeg/repmass/families/
# echo; mi usa el mismo nulo de adyacencia barajada. heaps_beta se
# ajusta por regresión log-log en 4 puntos del crecimiento (n/4..n).

controles:
  naturales: [culpeper, copiale-de]
  administrativos: [cuneiform, indus, lineara, protoelam]
  cifrados: [copiale]
  refranes: [rongorongo]
  negativos_sinteticos: [shuffled, markov1, markov2, markov3, markov4,
                         autocite, codebook]
